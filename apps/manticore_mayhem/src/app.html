<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		
		<!-- Stake checklist: main frame must not scroll, double-tap/pinch zoom disabled on mobile -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<style>
			/* iOS ignores user-scalable=no; touch-action: manipulation is what actually kills double-tap zoom
			   there. pixi-svelte sets touch-action:auto inline on the canvas, hence the !important. */
			html,
			body {
				touch-action: manipulation;
				overscroll-behavior: none;
			}
			canvas {
				display: block; /* inline canvas leaves a 4px baseline gap that makes the page scrollable */
				touch-action: manipulation !important;
			}

			   PolyMath splash — STATIC, IN THE SHELL (2026-09-15).
			   This used to be src/ui/PolyMathIntro.svelte, i.e. a Svelte component inside the bundle:
			   on Slow 4G nothing painted for 43 s because the whole app had to download and execute
			   first. It is now plain HTML + CSS in the shell, so it paints as soon as this <style>
			   arrives — the markup and every keyframe below are a 1:1 transcription of that component
			   (six edges, node pops, lockup rise, glow, scanline, radial ground, legal line, and both
			   the landscape and portrait sizing tables, which the fit script below applies).
			   The two fonts are inlined as SUBSETS (glyphs actually used) so the wordmark is instant:
			     python -m fontTools.subset static/assets/fonts/ui/Sora-Variable.woff2 \
			       --text="PolyMath" --flavor=woff2 --layout-features='' --no-hinting --desubroutinize
			     python -m fontTools.subset static/assets/fonts/ui/Outfit-Variable.woff2 \
			       --text="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·+%. " ...same flags
			   (the Outfit set is UPPERCASE: .sub and .legal are text-transform: uppercase, and a
			    subset built from the source strings dropped half of what is actually drawn.)
			   (both shipped faces are single static instances despite the "-Variable" name — Sora 800,
			   Outfit 900 — so a subset renders identically at every declared weight.) The families are
			   deliberately NAMED APART from the real 'Outfit'/'Sora' that ui/fontFaces.ts injects, so
			   the full faces landing later can never re-flow the splash.
			   Re-tune = edit here; there is no component any more.
			   2026-10-21, THE NEW SPLASH (Corey picked it in the preview ~/Desktop/Manticore Mayhem/images/splash_preview_r1,
			   "It looks great ... the next step is wiring it into both games"; the same splash in both games, only the accent,
			   the background and the lines differ). On top of the draw-in above:
			     - the pyramid: from 620 ms a dot runs one line of the mark, the node it reaches turns red and the mark turns
			       over as a 3D tetrahedron, a half-turn that lands back on the logo pose (the first flip lands at about
			       2.07 s, hence MIN_MS 2150); later passes, 1.6 s apart, run the whole triangle back to their start node;
			     - the wordmark: Poly flips up letter by letter, Math decodes;
			     - the bar: 20 skewed segments lit whole (5 points each), a shine and a spark; transforms only, the old
			       width-animated fill is gone;
			     - loading lines typed under the bar, one per stretch of it, each up at least LINE_MS;
			     - the background: wind-blown sand with a few red sparks;
			     - a tap ripple (visual only; the splash covers the game while it is up and takes no pointer once it fades);
			     - STILL LOADING · HANG TIGHT after 8 s;
			     - the exit: the mark bursts, its nodes fly out, the background parts from the centre (removed at 740 ms).
			       am-splash-out and isOut() still fire when the exit starts, so PRESS ANYWHERE keeps its timing.
			   Reduced motion (@media prefers-reduced-motion): no dot, no turn, no shine; the rings breathe, the lines and the
			   wordmark fade in, the shipped 450 ms fade out. Only transform, opacity and stroke-dashoffset animate: no
			   filter, no images, no requests. The fonts need no re-subset: every new string is A-Z, space and "·".
			   ──────────────────────────────────────────────────────────────────────────────────────── */

			#am-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483000;
				background: radial-gradient(120% 90% at 50% 42%, #171a22 0%, #0b0c10 62%, #07080b 100%);
				overflow: hidden;
				font-family: 'AMOutfitSplash', system-ui, sans-serif;
				color: #f4f6fb;
				--accent: #e32400; /* the game's theme accent: Manticore red (the x2 plate red). Angry Mantis is #9cd92f */
				opacity: 1;
			}
			#am-splash.am-out {
				opacity: 0;
				transition: opacity 450ms linear;
				pointer-events: none;
			}
			#am-splash::after {
				content: '';
				position: absolute;
				inset: 0;
				background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.014) 0 1px, transparent 1px 3px);
				pointer-events: none;
			}
			#am-splash .stage {
				position: absolute;
				left: 0;
				top: 0;
				transform-origin: top left;
				width: var(--w);
				height: var(--h);
				transform: translate(var(--tx), var(--ty)) scale(var(--s));
			}
			#am-splash .intro {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				overflow: hidden;
			}
			#am-splash .lock {
				display: flex;
				flex-direction: column;
				align-items: center;
				position: relative;
				z-index: 2;
				gap: var(--gap-mark);
			}
			#am-splash .glow {
				position: absolute;
				border-radius: 50%;
				background: radial-gradient(circle, color-mix(in oklab, var(--accent) 22%, transparent), transparent 68%);
				width: var(--glow-d);
				height: var(--glow-d);
				top: var(--glow-t);
				opacity: 0;
				animation: am-glow 520ms ease-out 240ms forwards;
			}
			@keyframes am-glow {
				0% { opacity: 0; transform: scale(0.7); }
				40% { opacity: 1; }
				100% { opacity: 0.55; transform: scale(1); }
			}
			#am-splash .mark {
				overflow: visible;
				display: block;
				width: var(--mark);
				height: var(--mark);
			}
			#am-splash .edge {
				fill: none;
				stroke: #f4f6fb;
				stroke-linecap: round;
				stroke-width: var(--stroke);
				stroke-dasharray: 1;
				stroke-dashoffset: 1;
				animation: am-draw 260ms cubic-bezier(0.5, 0, 0.25, 1) forwards;
			}
			@keyframes am-draw { to { stroke-dashoffset: 0; } }
			#am-splash .node {
				r: var(--node); /* the attribute cannot carry var(): WebKit logged an error per node */
				opacity: 0;
				transform-box: fill-box;
				transform-origin: center;
				stroke-width: var(--stroke);
				animation: am-pop 200ms cubic-bezier(0.2, 1.5, 0.4, 1) forwards;
			}
			@keyframes am-pop {
				0% { opacity: 0; transform: scale(0.2); }
				60% { opacity: 1; transform: scale(1.18); }
				100% { opacity: 1; transform: scale(1); }
			}
			#am-splash .lockup {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: var(--gap-wm);
			}
			#am-splash .wm {
				font-family: 'AMSoraSplash', system-ui, sans-serif;
				font-weight: 600;
				letter-spacing: -0.02em;
				line-height: 1;
				font-size: var(--wm-size);
			}
			#am-splash .wm em {
				font-style: normal;
				font-weight: 400;
				color: rgba(244, 246, 251, 0.62);
			}
			#am-splash .rule {
				height: 1px;
				width: var(--rule-w);
				background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 62%, transparent), transparent);
				transform: scaleX(0);
				animation: am-rule 300ms cubic-bezier(0.2, 0.7, 0.2, 1) 560ms forwards;
			}
			@keyframes am-rule { to { transform: scaleX(1); } }
			#am-splash .sub {
				font-weight: 500;
				color: var(--accent);
				text-transform: uppercase;
				line-height: 1;
				font-size: var(--sub-size);
				opacity: 0;
				animation: am-sub 320ms cubic-bezier(0.2, 0.7, 0.2, 1) 580ms forwards;
			}
			@keyframes am-rise { to { opacity: 1; transform: translateY(0); } }
			@keyframes am-sub {
				0% { opacity: 0; letter-spacing: 0.02em; transform: translateY(6px); }
				100% { opacity: 0.95; letter-spacing: var(--sub-ls); transform: translateY(0); }
			}
			#am-splash .legal {
				position: absolute;
				left: 0;
				right: 0;
				bottom: var(--legal-b);
				text-align: center;
				font-size: var(--legal-fs);
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: rgba(244, 246, 251, 0.26);
				opacity: 0;
				animation: am-rise 300ms ease-out 660ms forwards;
			}
			/* the bar's box: the bar itself is the segmented game bar (2026-10-21, below), lit in the theme accent; it is
			   there from the first paint (Corey 2026-09-15: it must be there from the start, 0% and all). */
			#am-splash .barwrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				margin-top: var(--bar-top);
				opacity: 0;
				transition: opacity 220ms ease;
			}
			#am-splash .barwrap.on { opacity: 1; }
			#am-splash .pct {
				font-weight: 700;
				letter-spacing: 1.5px;
				color: rgba(238, 240, 230, 0.5);
				font-variant-numeric: tabular-nums;
				font-size: var(--pct-fs);
			}

			/* ── the 2026-10-21 splash (Corey's pick in the preview: ideas=1,2,3,7,8,9&bg=theme&py=loop&poly=flip&math=decode).
			   Compact rules from the preview's fragments (~/Desktop/Manticore Mayhem/images/splash_preview_r1/source/lib.js
			   and r2.js); only transform, opacity and stroke-dashoffset animate ── */
/* exit (idea 9): the background is two half panels that part from the centre */
#am-splash{background:transparent}
#am-splash .x9p>div{position:absolute;top:0;bottom:0;width:50%;background:radial-gradient(120% 90% at 50% 42%,#171a22 0%,#0b0c10 62%,#07080b 100%);background-size:200% 100%}

#am-splash .x9p .r{right:0;background-position:100% 0}

/* wordmark: Poly flips up letter by letter, Math decodes (each slot rolls PolyMath letters, then its own) */
#am-splash .wh{display:inline-block;position:relative}
#am-splash .hp{--b:470ms}#am-splash .hm{--b:640ms}
#am-splash .wh i{display:inline-block;font-style:normal}
#am-splash .s-flip i{opacity:0;transform:perspective(2em) rotateX(-95deg);transform-origin:50% 80%;animation:am-w-flip 480ms cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(var(--b) + var(--i)*60ms)}
@keyframes am-w-flip{0%{opacity:0;transform:perspective(2em) rotateX(-95deg)}30%{opacity:1}100%{opacity:1;transform:perspective(2em) rotateX(0)}}
@keyframes am-w-on{to{opacity:1}}
#am-splash .dc{position:relative}
#am-splash .dc>u{text-decoration:none;opacity:0;animation:am-w-on 1ms linear calc(var(--b) + var(--i)*70ms + 300ms + var(--i)*60ms) forwards}
#am-splash .dc>b{position:absolute;left:-.45em;right:-.45em;top:-.15em;height:1.3em;overflow:hidden;text-align:center;font-weight:inherit;opacity:0;animation:am-w-dw calc(300ms + var(--i)*60ms) linear calc(var(--b) + var(--i)*70ms) forwards}
#am-splash .dc s{display:block;text-decoration:none;line-height:1.3em;white-space:pre;animation:am-w-dc calc(300ms + var(--i)*60ms) steps(6,end) calc(var(--b) + var(--i)*70ms) forwards}
@keyframes am-w-dw{0%,99%{opacity:1}100%{opacity:0}}
@keyframes am-w-dc{to{transform:translateY(-7.8em)}}
@keyframes am-w-fade{to{opacity:1}}
/* tap ripple (idea 7): visual only, the splash already covers the game */
#am-splash .pg{position:absolute;top:0;left:50%;width:var(--mark);height:var(--mark);margin-left:calc(var(--mark)/-2);pointer-events:none}
#am-splash .pg b{position:absolute;width:26%;height:26%;margin:-13% 0 0 -13%;border-radius:50%;box-sizing:border-box;border:2px solid var(--accent);opacity:0}
#am-splash .pg .n0{left:50%;top:17.6%}#am-splash .pg .n1{left:14%;top:80%}#am-splash .pg .n2{left:86%;top:80%}#am-splash .pg .n3{left:50%;top:59.2%}
#am-splash .rip{position:absolute;width:26vmin;height:26vmin;margin:-13vmin 0 0 -13vmin;border-radius:50%;box-sizing:border-box;border:3px solid var(--accent);opacity:0;pointer-events:none;z-index:3}
/* the bar (idea 2): 20 skewed segments lit whole, a shine clipped to the lit part, a spark on the edge; transforms only */
#am-splash .gbar{position:relative;width:var(--bar-w);height:calc(var(--bar-h)*1.8);padding:3px;box-sizing:border-box;border-radius:5px;background:rgba(0,0,0,.6);box-shadow:inset 0 1px 3px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07);transform:skewX(-14deg)}
#am-splash .gs{display:flex;gap:3px;height:100%}
#am-splash .gs i{flex:1;position:relative;border-radius:2px;background:rgba(255,255,255,.06)}
#am-splash .gs i::after{content:'';position:absolute;inset:0;border-radius:2px;background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 55%,#fff),var(--accent) 55%,color-mix(in oklab,var(--accent) 70%,#000));box-shadow:0 0 8px color-mix(in oklab,var(--accent) 55%,transparent);opacity:0;transition:opacity 140ms ease-out var(--d,0ms)}
#am-splash .gs i.on::after{opacity:1;animation:am-i2-pop 260ms cubic-bezier(.2,1.6,.4,1) var(--d,0ms)}
@keyframes am-i2-pop{from{transform:scaleY(1.6)}to{transform:scaleY(1)}}
#am-splash .gw{position:absolute;inset:3px;overflow:hidden;border-radius:2px}
#am-splash .gc{position:absolute;inset:0;overflow:hidden;transform:translateX(-100%)}
#am-splash .gi{position:absolute;inset:0;transform:translateX(100%)}
#am-splash .gc,#am-splash .gi,#am-splash .gk{transition:transform 160ms ease-out}
#am-splash .gsh{position:absolute;top:0;bottom:0;left:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:am-i2-shine 1800ms ease-in-out 600ms infinite both}
@keyframes am-i2-shine{0%{transform:translateX(-100%)}70%,100%{transform:translateX(460%)}}
#am-splash .gk{position:absolute;inset:3px;opacity:0}
#am-splash .gk.on{opacity:1}
#am-splash .gk b{position:absolute;left:0;top:50%;width:calc(var(--bar-h)*2.8);height:calc(var(--bar-h)*2.8);margin:calc(var(--bar-h)*-1.4) 0 0 calc(var(--bar-h)*-1.4);border-radius:50%;background:radial-gradient(circle,#fff 0 12%,color-mix(in oklab,var(--accent) 50%,#fff) 24%,transparent 62%);animation:am-i2-spark 170ms linear infinite alternate}
@keyframes am-i2-spark{from{transform:scale(.7) rotate(0);opacity:.7}to{transform:scale(1.15) rotate(45deg);opacity:1}}
/* loading lines (idea 3), typed */
#am-splash .lines{position:relative;width:var(--bar-w);height:calc(var(--pct-fs)*1.6)}
#am-splash .ln{position:absolute;left:0;right:0;top:0;text-align:center;white-space:pre;font-weight:700;font-size:var(--pct-fs);letter-spacing:.22em;line-height:1.6;color:var(--accent);transition:opacity 200ms ease-out}
#am-splash .ln.gone{opacity:0}
#am-splash .ln span{opacity:0;animation:am-i3-type 1ms linear forwards;animation-delay:calc(var(--i)*36ms)}
#am-splash .ln::after{content:'';display:inline-block;width:.55em;height:.9em;margin-left:-.05em;vertical-align:-.1em;background:var(--accent);opacity:0;animation:am-i3-caret 1000ms steps(1) calc(var(--n)*36ms) infinite}
@keyframes am-i3-type{to{opacity:1}}
@keyframes am-i3-caret{0%{opacity:.85}50%{opacity:0}}
@keyframes am-i3-in{from{opacity:0}}
/* slow-load message (idea 8), from 8 s */
#am-splash .slow{position:absolute;left:0;right:0;bottom:calc(var(--legal-b) + var(--legal-fs)*3.2);text-align:center;font-weight:700;font-size:var(--pct-fs);letter-spacing:.24em;color:rgba(244,246,251,.6);opacity:0;transition:opacity 800ms ease-out}
#am-splash .slow.on{opacity:1}
#am-splash .slow.on span{display:inline-block;animation:am-i8-b 2600ms ease-in-out 800ms infinite}
@keyframes am-i8-b{0%,100%{opacity:1}50%{opacity:.5}}
/* reduced motion: no dot, no turn, no shine, no ripple growth; calm fades */
@media (prefers-reduced-motion: reduce){
#am-splash .bgt .sd{animation:none}

				   (Corey 2026-10-21: "Yes keep it for at least 2.15 seconds"; it was 1200, the 880 ms draw-in) */
				var MIN_MS = 2150;

				/* SMOOTHING (Corey 2026-09-15): the reports are bursty — the bundle streams per chunk,
				   the landing images per chunk, but a Pixi asset only reports when it has fully landed,
				   so one big atlas is a 10-20 s silence on a slow link. Between reports the bar keeps
				   moving at the download's own measured pace (points per ms since the splash appeared),
				   never more than `lead` points past the last real report, never past the share, never
				   backwards. Every real report is caught up to at once. */
				var painted = 0, target = 0, lead = 6, lastReportAt = 0;
				function paint() {
					var total = bundle.total + assets.total + preload.total;
					var loaded = bundle.loaded + assets.loaded + preload.loaded;
					var p = total > 0 ? Math.min(1, loaded / total) : 0;
					target = Math.max(p * share * 100, creep);
					lastReportAt = Date.now();
					draw();
				}
				function draw() {
					var cap = share * 100;
					var elapsed = Date.now() - t0;
					var rate = elapsed > 0 ? target / elapsed : 0; /* points per ms so far */
					var predicted = target + Math.min(lead, rate * (Date.now() - lastReportAt));
					var p = Math.round(Math.min(cap, Math.max(target, predicted)));
					if (p < painted) p = painted; /* never backwards */
					painted = p;
					pct.textContent = 'LOADING · ' + p + '%';
					paintBar(p);
					paintLines(cap > 0 ? p / cap : 0);
				}
				var drawTimer = setInterval(function () { if (gone) return clearInterval(drawTimer); draw(); }, 200);

				var api = {
					setBundle: function (l, t) { bundle.loaded = l; bundle.total = t; paint(); },
					setAssets: function (l, t) { assets.loaded = l; assets.total = t; paint(); },
					setPreload: function (l, t) { preload.loaded = l; preload.total = t; paint(); },
					setShare: function (s) { share = Math.max(0.01, Math.min(1, s)); paint(); },
					getShare: function () { return share; },
					hideNow: function () { gone = true; stopExtras(); out(); if (el.parentNode) el.parentNode.removeChild(el); },
					done: function () {
						if (gone) return;
						gone = true;
						setTimeout(leave, Math.max(0, MIN_MS - (Date.now() - t0)));
					},
					/* the splash has started its fade (it takes no pointer from then on) or is gone: the landing screen
					   shows PRESS ANYWHERE only from here (game/boot.svelte.ts splashOut; a tap on the splash was lost) */
					isOut: function () { return isOut; }
				};
				var isOut = false;
				function out() {
					if (isOut) return;
					isOut = true;
					try { window.dispatchEvent(new Event('am-splash-out')); } catch (e) {}
				}
				window.__amSplash = api;

				/* the fade: never in the middle of the pyramid's first flip (a busy main thread can start it late), then the
				   exit (idea 9: the panels part over 710 ms, removed at 740; reduced motion keeps the shipped 450 ms fade) */
				function leave() {
					if (flipEndAt > Date.now()) return void setTimeout(leave, flipEndAt - Date.now());
					stopExtras();
					el.classList.add('am-out');
					out();
					setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, RM ? 520 : 740);
				}
				function stopExtras() {
					pyStop = true;
					clearTimeout(pyTimer);
					pyClear();
					clearTimeout(slowTimer);
				}

				/* the bar (idea 2): lights whole segments, 5 points each; a big jump runs them 45 ms apart */
				var segs = el.querySelectorAll('.gs i'), gc = el.querySelector('.gc'), gi = el.querySelector('.gi'), gk = el.querySelector('.gk'), lit = 0;
				function paintBar(p) {
					var m = Math.min(20, Math.floor(p / 5));
					if (m <= lit) return;
					for (var i = lit; i < m; i++) { segs[i].style.setProperty('--d', (i - lit) * 45 + 'ms'); segs[i].classList.add('on'); }
					lit = m;
					var f = m * 5;
					gc.style.transform = 'translateX(' + (f - 100) + '%)';
					gi.style.transform = 'translateX(' + (100 - f) + '%)';
					gk.style.transform = 'translateX(' + f + '%)';
					gk.classList.toggle('on', m > 0 && m < 20);
				}

				/* loading lines (idea 3): a line per stretch of the bar (fractions of the splash's share), one at a time, each up
				   for at least LINE_MS so every line reads on a slow load (Corey 2026-10-21 "Yes": each about 2 s) */
				var LINES = ["SHARPENING CLAWS","RAISING THE WAR STANDARDS","COILING THE STINGER","STOCKING THE ARMOURY","POLISHING THE CROWN","WAKING THE MANTICORE"];
				var LINE_AT = [0,0.12,0.3,0.5,0.7,0.88], LINE_MS = 2000;
				var linesBox = el.querySelector('.lines'), lineWant = 0, lineShown = -1, lineBusy = false, lineCur = null;
				function showLine(i) {
					if (lineCur) { var o = lineCur; o.classList.add('gone'); setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, 220); }
					var d = document.createElement('div'), txt = LINES[i];
					d.className = 'ln';
					for (var k = 0; k < txt.length; k++) { var sp = document.createElement('span'); sp.style.setProperty('--i', k); sp.textContent = txt[k]; d.appendChild(sp); }
					d.style.setProperty('--n', txt.length);
					linesBox.appendChild(d);
					lineCur = d;
					lineShown = i;
					lineBusy = true;
					setTimeout(function () { lineBusy = false; nextLine(); }, Math.max(LINE_MS, txt.length * 36 + 600));
				}
				function nextLine() { if (!gone && !lineBusy && lineWant > lineShown) showLine(lineShown + 1); } /* none starts once done() is in: the exit would cut it */
				function paintLines(f) {
					var w = 0;
					for (var i = 0; i < LINE_AT.length; i++) if (f >= LINE_AT[i]) w = i;
					lineWant = Math.min(w, LINES.length - 1);
					nextLine();
				}

				/* the pyramid (idea 1): 620 ms in (the draw-in is done), the first pass runs ONE line and flips (1490 ms);
				   every later pass, after a 1.6 s hold, runs the whole triangle back to its start node, which flips (3340 ms).
				   One timer and one forced reflow per pass; the rest is CSS keyframes. Not under reduced motion. */
				var lock = el.querySelector('.lock'), pyTimer = 0, pyK = -1, pyStop = false, flipEndAt = 0;
				function pyClear() { lock.classList.remove('pyg', 'pF', 'pL', 'pv0', 'pv1', 'pv2'); }
				function pyGo(first) {
					if (pyStop) return;
					var n = Math.floor(Math.random() * 3);
					if (n === pyK) n = (n + 1 + Math.floor(Math.random() * 2)) % 3;
					pyK = n;
					pyClear();
					void lock.offsetWidth;
					lock.classList.add('pyg', first ? 'pF' : 'pL', 'pv' + n);
					var d = first ? 1490 : 3340;
					if (first) flipEndAt = Date.now() + d;
					pyTimer = setTimeout(function () { pyGo(false); }, d + 1600);
				}
				if (!RM) pyTimer = setTimeout(function () { pyGo(true); }, 620);

				/* the slow-load message (idea 8) */
				var slowTimer = setTimeout(function () { el.querySelector('.slow').classList.add('on'); }, 8000);

				/* tap ripple (idea 7): visual only; passive, never prevents or stops the event (the splash covers the game
				   while it is up and takes no pointer once it fades) */
				if (el.animate) {
					var pings = el.querySelectorAll('.pg b');
					el.addEventListener('pointerdown', function (e) {
						if (el.classList.contains('am-out')) return;
						var r = document.createElement('div');
						r.className = 'rip';
						r.style.left = e.clientX + 'px';
						r.style.top = e.clientY + 'px';
						el.appendChild(r);
						r.animate(RM ? [{ opacity: 0.5 }, { opacity: 0 }] : [{ transform: 'scale(.08)', opacity: 0.9 }, { transform: 'scale(1)', opacity: 0 }], { duration: RM ? 500 : 700, easing: 'cubic-bezier(.2,.6,.3,1)' }).onfinish = function () { if (r.parentNode) r.parentNode.removeChild(r); };
						for (var i = 0; i < pings.length; i++) {
							var b = pings[i].getBoundingClientRect(), dist = Math.hypot(b.left + b.width / 2 - e.clientX, b.top + b.height / 2 - e.clientY);
							pings[i].animate(RM ? [{ opacity: 0.6 }, { opacity: 0 }] : [{ transform: 'scale(.5)', opacity: 1 }, { transform: 'scale(1.7)', opacity: 0 }], { duration: RM ? 600 : 520, delay: Math.min(500, dist * 0.8), easing: 'ease-out' });
						}
					}, { passive: true });
				}

				/* a replay link is a recording: the round card is the first thing it shows */
				try {
					if (new URLSearchParams(location.search).get('replay') === 'true') api.hideNow();
				} catch (e) {}

				/* ── bundle phase ──────────────────────────────────────────────────────────────────
				   Production only. The kit emits ONE external module (bundleStrategy 'single'); we
				   stream it with fetch so the bar can report real bytes, then execute the text in an
				   inline <script type="module">. Two rewrites are needed for that to be equivalent to
				   letting the browser import the file:
				     - import.meta.url inside the bundle is the base for every `new URL('../../assets/
				       …')` in game/assets.ts. Inline, that would be the DOCUMENT url (two levels too
				       shallow), so every occurrence is repointed at the bundle's own URL.
				     - the trailing `export{X as start}` is unreachable from an inline module, so the
				       local name is lifted onto globalThis and called here.
				   A blob: URL would be the obvious alternative and is NOT usable: engine.io's CSP has
				   no blob: source. If either rewrite does not match, we fall back to a plain dynamic
				   import of the same URL (correct, just a second download). */
				var boot = window.__AM_BOOT;
				if (!boot) {
					/* vite dev: the bundle phase is invisible to us, so the bar creeps toward 60 % of the
					   splash's share over ~5 s until game/boot.svelte.ts reports real bytes */
					var c0 = Date.now();
					var creepTimer = setInterval(function () {
						if (gone) return clearInterval(creepTimer);
						creep = Math.min(share * 60, ((Date.now() - c0) / 5000) * share * 60);
						paint();
					}, 120);
					return;
				}
				bundle.total = boot.jsBytes || 0;
				/* seed the landing-asset half of the denominator now: the bar must never reach the
				   share on the bundle alone and then snap back when game/boot.svelte.ts reports its total */
				assets.total = boot.assetBytes || 0;
				preload.total = boot.preloadBytes || 0;
				var everything = bundle.total + assets.total + preload.total + (boot.audioBytes || 0);
				if (everything > 0) share = (bundle.total + assets.total + preload.total) / everything;
				paint();

				var jsUrl = new URL(boot.js, document.baseURI).href;
				/* the kit's own inline starter set this global before importing; $app/paths reads it
				   at module-evaluation time, so it has to exist before the bundle runs, not after */
				globalThis[boot.kitVar] = { base: new URL('.', location).pathname.slice(0, -1) };

				function startApp(start) {
					start(document.getElementById('am-mount'));
				}
				function plainImport() {
					import(/* @vite-ignore */ jsUrl).then(function (app) { startApp(app.start); });
				}

				/* The stylesheet is fetched and injected as an inline <style>, not left as a <link> in
				   <head>. Two reasons:
				     - a render-blocking <link rel=stylesheet> would hold the splash's first paint
				       hostage to a 52 KB file;
				     - url() inside a CSS custom property resolves against the STYLESHEET's URL in
				       Chrome, not the document's. ui/Shine.svelte passes the logo/tagline image in as
				       a custom property, so from /_app/immutable/assets/bundle.css those became
				       /_app/immutable/assets/assets/ui/logo-wide.webp — three 404s and no glint
				       (caught on the first production probe, 2026-09-15). Inline, the base is the
				       document again, exactly as under bundleStrategy 'inline'. */
				var cssReady = boot.css
					? fetch(new URL(boot.css, document.baseURI).href, { credentials: 'same-origin' })
							.then(function (r) { return r.text(); })
							.then(function (css) {
								var style = document.createElement('style');
								style.textContent = css;
								document.head.appendChild(style);
							})
							.catch(function (e) { console.error('[am-splash] stylesheet failed', e); })
					: Promise.resolve();

				fetch(jsUrl, { credentials: 'same-origin' })
					.then(function (res) {
						if (!res.ok) throw new Error('bundle ' + res.status);
						var len = Number(res.headers.get('content-length') || 0);
						/* compressed transfer hides the length: fall back to the size the build baked in */
						if (len > 0) bundle.total = len;
						if (!res.body) return res.text();
						var reader = res.body.getReader();
						var chunks = [], got = 0;
						return (function pump() {
							return reader.read().then(function (r) {
								if (r.done) return new TextDecoder().decode(concat(chunks, got));
								chunks.push(r.value);
								got += r.value.length;
								bundle.loaded = Math.min(got, bundle.total || got);
								paint();
								return pump();
							});
						})();
					})
					.then(function (text) {
						return cssReady.then(function () { return text; });
					})
					.then(function (text) {
						bundle.loaded = bundle.total;
						paint();
						var m = /export\s*\{([^{}]*)\}\s*;?\s*$/.exec(text);
						var local = null;
						if (m) {
							var aliased = /([$\w]+)\s+as\s+start\s*(?:,|$)/.exec(m[1]);
							if (aliased) local = aliased[1];
							else if (/(?:^|,)\s*start\s*(?:,|$)/.test(m[1])) local = 'start';
						}
						if (!local) { plainImport(); return; }
						var body = text.slice(0, m.index).replace(/import\.meta\.url/g, 'globalThis.__AM_BUNDLE_URL__');
						globalThis.__AM_BUNDLE_URL__ = jsUrl;
						globalThis.__AM_ON_BUNDLE__ = function (start) { startApp(start); };
						var s = document.createElement('script');
						s.type = 'module';
						s.textContent = body + '\n;globalThis.__AM_ON_BUNDLE__(' + local + ');\n';
						document.head.appendChild(s);
					})
					.catch(function (err) {
						console.error('[am-splash] bundle fetch failed, falling back to import()', err);
						plainImport();
					});

				function concat(chunks, total) {
					var out = new Uint8Array(total), at = 0;
					for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], at); at += chunks[i].length; }
					return out;
				}
			})();
		</script>
		<div id="am-mount">%sveltekit.body%</div>
	</body>
</html>
